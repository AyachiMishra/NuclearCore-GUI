name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # SIMULATE-3 listings are plant data and are not committed, so the tests
      # that need one skip. What remains still covers the layout primitives,
      # the column arithmetic, geometry resolution, symmetry expansion for
      # rotational/mirror/octant cores, and report escaping -- i.e. the parts
      # that break silently. See README: Running the tests.
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short

      - name: Report what was skipped
        if: always()
        run: |
          python -m pytest tests/ -q -rs 2>&1 | tail -20 || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Byte-compile every module
        run: python -m compileall -q s3dash tools tests

      - name: Front end has no network dependencies
        # A CDN reference would break the offline guarantee the tool makes.
        run: |
          if grep -rInE 'https?://|cdn\.|unpkg|jsdelivr' s3dash/web/static/; then
            echo "::error::front end must not reference external resources"
            exit 1
          fi
          echo "front end is self-contained"
